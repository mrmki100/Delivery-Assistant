# Admin Server Configuration
[server]
host = "0.0.0.0"
port = 8088
data_dir = "data"
releases_dir = "releases"
secret_key = "replace-with-a-random-secret-key-for-server-auth"
signing_key_path = "data/keys/release_signer.key"
public_key_path = "data/keys/release_verifier.pub"

[security]
require_device_enrollment = true
max_otp_attempts = 3
otp_ttl_seconds = 300
rate_limit_requests_per_minute = 120
