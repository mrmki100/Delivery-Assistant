# Windows Update Agent Configuration
[agent]
device_id = "LAPTOP-01"
server_url = "http://192.168.1.50:8088"
device_token = "replace-with-device-enrollment-token"
extension_dir = "C:\\Users\\mrmki\\Documents\\antiGG repo\\Delivery Assistant"
data_dir = "data"
log_dir = "logs"
check_interval_seconds = 3600

[updater]
max_package_size_bytes = 52428800 # 50 MB
public_key_path = "data/keys/release_verifier.pub"
verification_secret = "replace-with-hmac-or-public-key"
staging_dir = "data/staging"
backup_dir = "data/backups"
activation_timeout_seconds = 60

[folder_access]
default_lease_minutes = 30
max_lease_minutes = 60
otp_length = 8
otp_ttl_seconds = 300
